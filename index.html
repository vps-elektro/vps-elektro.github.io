<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VPS ELEKTRO</title>

  <style>
    /* nastavení těla */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      color: #222;
      text-align: center;
    }

    /* Navigační lišta */

    .navigation {
      position: sticky;
      top: 20px;
      z-index: 1000;

      display: flex;
      justify-content: center;
      align-items: stretch;
      
      background-color: white;
      padding: 0;
    }

    .navigation a {
      display: flex;
      align-items: center;
      
      color: #111;
      text-decoration: none;

      font-family: "Trebuchet MS", Arial, sans-serif;
      font-size: 20px;
      font-weight: normal;
      text-transform: uppercase;
      
      padding: 35px 28px;

      transition: background-color 0.25s, color 0.25s;
    }

    .navigation a:hover {
      background-color: #1e532f;
      color: white;
      text-decoration: none;
    }

    .logo-link {
      padding: 15px 25px !important;
    }

    .logo-link:hover {
      background-color:white !important;
    }

    .logo {
      display: block;
      height: 120px;
      width: auto;
    }
    
    /* Záhlavý stránky */
    header {
      padding: 80px 20px;
      background-color: white;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 15px;
    }

    p {
      font-size: 20px;
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 25px;
      background-color: #1e532f;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }

    .button:hover {
      background-color: #286b3d;
    }

    .menu-toggle {
      display: none;
    }

    .menu-links {
      display: flex;
    }

    @media (max-width: 1000px) {

      .navigation {
        top:0;
        flex-wrap: wrap;
        width: 100%;
      }

      .navigation .logo-link {
        width: 100%;
        justify-content: center;
        padding: 12px 0;
      }

      .logo {
        height: 55px;
        width: auto;
      }

      .menu-toggle {
        display: block;
        width: 100%;
        padding: 14px;

        border: none;
        background-color: #1e532f;
        color: white;

        font-size: 18px;
        cursor: pointer;
      }

      .menu-links {
        display: none;
        flex-direction: column;
        width: 100%;
      }

      .menu-links.open {
        display: flex;
      }

      .menu-links a {
        justify-content: center;
        padding: 14px 10px;
        font-size: 14px;
      }

      header {
        padding: 60px 20px;
      }

      h1 {
        font-size: 36px;
      }

      p {
        font-size: 18px;
      }
    }
    
  </style>
</head>

/*######################################## EDITOVAT ZDE ######################################*/
  
<body>

<script>
  function toggleMenu() {
    const menu = document.getElementById("menuLinks");
    menu.classList.toggle("open");
  }
</script>
  
  <nav class="navigation">

    <a href="#domu" class="logo-link">
      <img src="images/logo.jpg" alt="VPS ELEKTRO" class="logo">
    </a>

    <button class="menu-toggle" onclick="toggleMenu()">☰ Menu</button>

    <div class="menu-links" id="menuLinks">
      <a href="#domu">Domů</a>
      <a href="#aktuality">Aktuality</a>  
      <a href="#vyroba">Služby a výroba</a>
      <a href="#vyrobky">Naše výrobky</a>
      <a href="#kontakty">Kontakty</a>
      <a href="#kariera">Kariéra</a>
    </div>
  </nav>

  <header>
    <h1>Ahoj Pavli,</h1>

    <p>jak se máš?</p>

    <a class="button" href="mailto:panacek.jr@vps-elektro.cz">
      Kontaktujte nás
    </a>
  </header>

</body>
</html>
